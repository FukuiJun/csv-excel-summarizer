name: Build exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Test
        run: python -m pytest tests

      # バージョン：タグのビルドはタグ名（例 v1.2.0）、それ以外は dev-<コミット7桁>
      - name: Decide version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}" }
          else { $v = "dev-" + "${{ github.sha }}".Substring(0, 7) }
          "version=$v" >> $env:GITHUB_OUTPUT
          python tools/write_version.py $v

      - name: Build exe (onedir)
        run: pyinstaller --noconfirm --clean --onedir --windowed --collect-data sv_ttk --collect-all tkinterdnd2 --icon assets/LogMerger.ico --add-data "assets;assets" --hidden-import _version --name LogMerger main.py

      # 配布フォルダにバージョンのメモ（VERSION.txt）を置く
      - name: Write VERSION.txt
        run: python tools/write_version.py ${{ steps.ver.outputs.version }} dist/LogMerger

      # 配布フォルダ名にもバージョンを付ける（展開すると LogMerger-v1.2.0\LogMerger.exe）
      - name: Rename folder
        shell: pwsh
        run: Rename-Item dist\LogMerger "LogMerger-${{ steps.ver.outputs.version }}"

      # ダウンロードすると LogMerger-<バージョン>.zip（中に LogMerger-<バージョン> フォルダ）になる
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogMerger-${{ steps.ver.outputs.version }}
          path: dist/
          if-no-files-found: error

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path "dist\LogMerger-${{ steps.ver.outputs.version }}" -DestinationPath LogMerger-${{ steps.ver.outputs.version }}.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LogMerger-${{ steps.ver.outputs.version }}.zip
